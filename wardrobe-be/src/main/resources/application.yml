spring:
  application:
    name: wardrobe-please

  http:
    clients:
      connect-timeout: 2s
      read-timeout: 15s

  # AI Configuration
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        base-url: https://api.openai.com/v1
        model: gpt-6-luna
        reasoning-effort: low
        max-completion-tokens: 500
        store: false
        replay-reasoning-content: false
        timeout: 15s
        max-retries: 10
      embedding:
        options:
          model: text-embedding-3-small
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-flash
        max-tokens: 500
        thinking:
          type: disabled
        response-format:
          type: JSON_OBJECT
    retry:
      max-attempts: 10
    vectorstore:
      qdrant:
        collection-name: "products"
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        use-tls: ${QDRANT_USE_TLS:false}
        api-key: ${QDRANT_API_KEY:}
        initialize-schema: true

# Application Configuration
ecom:
  search:
    # Max documents returned by the vector DB
    top-k: 10
    similarity-threshold: 0.15
    max-results: 10
    product-filter-max-output-tokens: 300
  memory:
    inactivity-timeout: 24h
    cleanup-interval: 1h
  limits:
    per-minute: 5
    per-hour: 20
    daily-budget: 300
    trusted-proxy-hops: 1
  import:
    sample-file: sampledata/apparel_catalog.csv
  assets:
    base-url: ${ECOM_ASSETS_BASE_URL:/images/}
  browsing:
    categories-file: catalog/browsing-categories.json
    frontend-categories-file: ../eas-frontend/src/data/categories.json
    cursor-ttl: PT30M
    default-limit: 24

logging:
  level:
    # Spring AI includes provider response bodies in retry warnings and prompts in empty-response warnings.
    org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration: ERROR
    org.springframework.ai.deepseek.DeepSeekChatModel: ERROR
    org.springframework.ai.openai.OpenAiChatModel: ERROR
    org:
      springframework:
        ai: INFO
    com:
      ecomassistant: DEBUG

# Actuator: expose only the health endpoint under the public API base path.
# Readiness (startup runners finished + vector store reachable) is reported by the
# QdrantHealthIndicator and ReadinessHealthIndicator beans; the response body carries
# only the aggregate `status` field (`UP`/`DOWN`).
#
# The built-in availability probes are disabled: their readiness state reports
# `OUT_OF_SERVICE` (not `DOWN`) and would add a `groups` field to the body, while the
# contract requires a bare `status` of `UP` or `DOWN`.
management:
  endpoints:
    web:
      base-path: /api/v1
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false
